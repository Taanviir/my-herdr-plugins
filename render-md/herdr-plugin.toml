id = "taanviir.render-md"
name = "Render MD"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Read markdown rendered in a pane beside your agent, live as it changes"
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "open"
title = "Render MD"
contexts = ["workspace"]
command = ["node", "bin/open.js"]

[[actions]]
id = "setup"
title = "Set up the Render MD key and the mdr command"
contexts = ["workspace"]
command = ["node", "bin/setup.js"]

[[panes]]
id = "view"
title = "Render MD"
placement = "split"
command = ["node", "bin/view.js"]
